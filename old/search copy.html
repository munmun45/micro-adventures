<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place Search Results</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <section class="max-w-6xl mx-auto px-4 py-6 space-y-4">

        <!-- PLACE CARD -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden flex flex-col sm:flex-row">

            <!-- LEFT IMAGE -->
            <div class="sm:w-1/3 relative" style="height:130px;">
                <img src="https://images.unsplash.com/photo-1548013146-72479768bada" class="w-full h-full object-cover">

                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>

                <div class="absolute bottom-4 left-4">
                    <h3 class="text-lg font-semibold text-white">Shillong</h3>
                    <p class="text-sm text-white/90">Meghalaya · Hill Station</p>
                </div>
            </div>

            <!-- RIGHT CONTENT -->
            <div class="sm:w-2/3 p-4 flex flex-col justify-between">

                <!-- INFO GRID -->
                <div class="grid grid-cols-2 gap-4 text-sm">

                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                            <i class="bi bi-ticket-perforated"></i>
                        </span>
                        <div>
                            <div class="text-xs text-gray-500">Entry Ticket</div>
                            <div class="font-medium">₹50</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center">
                            <i class="bi bi-clock"></i>
                        </span>
                        <div>
                            <div class="text-xs text-gray-500">Total Time</div>
                            <div class="font-medium">4–5 hrs</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-green-50 text-green-600 flex items-center justify-center">
                            <i class="bi bi-shield-check"></i>
                        </span>
                        <div>
                            <div class="text-xs text-gray-500">Safety</div>
                            <div class="font-medium">High</div>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center">
                            <i class="bi bi-sunrise"></i>
                        </span>
                        <div>
                            <div class="text-xs text-gray-500">Best Time</div>
                            <div class="font-medium">Morning</div>
                        </div>
                    </div>

                    <div class="col-span-2 mt-1">
                        <button onclick="openDocs('shillong')"
                            class="flex items-center gap-2 text-blue-600 text-sm font-medium">
                            <span class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                                <i class="bi bi-file-earmark-text"></i>
                            </span>
                            Documents Needed
                        </button>
                    </div>
                </div>

                <!-- ================= ACTIVITY SLIDER ================= -->
                <div class="mt-4">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">
                        Activities Available
                    </h4>

                    <div class="flex gap-3 overflow-x-auto pb-2">



                        <!-- ACTIVITY CARD -->
                        <div
                            class="min-w-[240px] bg-white border border-gray-200 rounded-2xl p-4 hover:shadow-md transition flex gap-4">

                            <!-- IMAGE -->
                            <div class="w-16 rounded-xl overflow-hidden shrink-0">
                                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                                    class="w-full h-full object-cover">
                            </div>

                            <!-- CONTENT -->
                            <div class="flex-1 flex flex-col justify-between">

                                <!-- TITLE -->
                                <div>
                                    <h5 class="text-sm font-semibold text-gray-900">
                                        Boating
                                    </h5>

                                    <!-- META -->
                                    <div class="mt-1 space-y-1 text-xs text-gray-500">

                                        <div class="flex items-center gap-1">
                                            <i class="bi bi-clock"></i>
                                            <span>9:00 AM – 5:00 PM</span>
                                        </div>

                                        <div class="flex items-center gap-1">
                                            <i class="bi bi-shield-check text-green-600"></i>
                                            <span>Safe Activity</span>
                                        </div>

                                    </div>
                                </div>

                                <!-- PRICE -->
                                <div class="mt-2 flex items-center justify-between">
                                    <span class="text-sm font-medium text-gray-800 flex items-center gap-1">
                                        <i class="bi bi-cash-coin"></i> ₹100
                                    </span>

                                    <span class="text-xs px-2 py-0.5 rounded-full
                         bg-green-50 text-green-700 font-medium">
                                        Optional
                                    </span>
                                </div>
                            </div>
                        </div>
                        <!-- ACTIVITY CARD -->
                        <div
                            class="min-w-[240px] bg-white border border-gray-200 rounded-2xl p-4 hover:shadow-md transition flex gap-4">

                            <!-- IMAGE -->
                            <div class="w-16 rounded-xl overflow-hidden shrink-0">
                                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                                    class="w-full h-full object-cover">
                            </div>

                            <!-- CONTENT -->
                            <div class="flex-1 flex flex-col justify-between">

                                <!-- TITLE -->
                                <div>
                                    <h5 class="text-sm font-semibold text-gray-900">
                                        Boating
                                    </h5>

                                    <!-- META -->
                                    <div class="mt-1 space-y-1 text-xs text-gray-500">

                                        <div class="flex items-center gap-1">
                                            <i class="bi bi-clock"></i>
                                            <span>9:00 AM – 5:00 PM</span>
                                        </div>

                                        <div class="flex items-center gap-1">
                                            <i class="bi bi-shield-check text-green-600"></i>
                                            <span>Safe Activity</span>
                                        </div>

                                    </div>
                                </div>

                                <!-- PRICE -->
                                <div class="mt-2 flex items-center justify-between">
                                    <span class="text-sm font-medium text-gray-800 flex items-center gap-1">
                                        FREE
                                    </span>

                                    <span
                                        class="text-xs px-2 py-0.5 rounded-full bg-green-50 text-green-700 font-medium">
                                        Included
                                    </span>
                                </div>
                            </div>
                        </div>



                    </div>
                </div>
                <!-- ================= END ACTIVITY SLIDER ================= -->

                <!-- BUTTON -->
                <div class="mt-5" style="display: flex; gap: 11px;">
                    <button class="w-full sm:w-auto px-6 py-2.5 rounded-xl
                               bg-green text-white text-sm font-medium hover:bg-gray-800"
                        style="background-color: #009688;">
                        Select Place
                    </button>
                    <button class="w-full sm:w-auto px-6 py-2.5 rounded-xl
                               bg-black text-white text-sm font-medium hover:bg-gray-800">
                        Explore More
                    </button>
                </div>

            </div>
        </div>

    </section>

    <!-- DOCUMENT MODAL -->
    <div id="docModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 mx-4">
            <h3 class="text-lg font-semibold mb-4">Required Documents</h3>
            <div id="docContent" class="space-y-2"></div>
            <button onclick="closeDocs()" class="mt-5 w-full py-2.5 rounded-xl bg-black text-white">
                Close
            </button>
        </div>
    </div>

    <script>
        const docsData = {
            shillong: [
                "Valid Photo ID (Aadhaar / Passport)",
                "Local Entry Permit (if applicable)",
                "Hotel Booking Proof",
                "Travel Insurance (recommended)"
            ]
        };

        function openDocs(place) {
            const modal = document.getElementById("docModal");
            const content = document.getElementById("docContent");
            content.innerHTML = "";
            docsData[place].forEach(doc => {
                content.innerHTML += `
                <div class="px-4 py-2 bg-gray-100 rounded-lg text-sm flex items-center gap-2">
                    <i class="bi bi-check-circle-fill text-green-600"></i>${doc}
                </div>`;
            });
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeDocs() {
            const modal = document.getElementById("docModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }
    </script>

</body>

</html>
