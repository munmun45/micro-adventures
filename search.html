<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place & Activities</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="bg-slate-100 text-slate-900">

    <main class="max-w-5xl mx-auto px-4 py-10 space-y-10">

        <!-- ================= PLACE CARD ================= -->
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">

            <!-- TOP -->
            <div class="flex gap-4 p-4">

                <!-- IMAGE -->
                <div onclick="togglePlace(this)"
                    class="relative w-24 h-24 rounded-xl overflow-hidden shrink-0 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1593693397690-362cb9666fc2"
                        class="w-full h-full object-cover">

                    <!-- SELECT -->
                    <div class="place-check hidden absolute top-2 right-2 w-6 h-6
          bg-emerald-500 text-white rounded-full flex items-center
          justify-center text-xs">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>

                <!-- INFO -->
                <div class="flex-1">
                    <h3 class="text-base font-semibold">
                        Nandankanan Zoological Park
                    </h3>
                    <p class="text-sm text-slate-500">
                        Bhubaneswar, Odisha
                    </p>

                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-sm text-slate-600">
                        <span><i class="fa-solid fa-ticket mr-1"></i> ₹50–₹100</span>
                        <span><i class="fa-regular fa-clock mr-1"></i> 3–4h</span>
                        <span class="text-emerald-600">
                            <i class="fa-solid fa-shield-halved mr-1"></i> Safe
                        </span>
                        <span><i class="fa-solid fa-paw mr-1"></i> Wildlife</span>
                    </div>
                </div>
            </div>




            <div class="bg-slate-50  p-4 space-y-4">


                <!-- ACTIVITY CARD -->
                <div onclick="toggleActivity(this)"
                    class="activity-card flex items-center gap-4 bg-white rounded-xl p-3 border cursor-pointer transition">

                    <div class="w-14 h-14 rounded-lg overflow-hidden shrink-0">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                            class="w-full h-full object-cover">
                    </div>

                    <div class="flex-1">
                        <h5 class="text-sm font-medium">Boating</h5>
                        <p class="text-xs text-slate-500">
                            ₹50 • 30–45 min • Safe
                        </p>
                    </div>

                    <div
                        class="activity-check hidden w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>

                <!-- ACTIVITY CARD -->
                <div onclick="toggleActivity(this)"
                    class="activity-card flex items-center gap-4 bg-white rounded-xl p-3 border cursor-pointer transition">

                    <div class="w-14 h-14 rounded-lg overflow-hidden shrink-0">
                        <img src="https://images.unsplash.com/photo-1593693397690-362cb9666fc2"
                            class="w-full h-full object-cover">
                    </div>

                    <div class="flex-1">
                        <h5 class="text-sm font-medium">Safari & Animal Viewing</h5>
                        <p class="text-xs text-slate-500">
                            Included • 1–2h • Wildlife
                        </p>
                    </div>

                    <div
                        class="activity-check hidden w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">
                        <i class="fa-solid fa-check"></i>
                    </div>
                </div>

            </div>




        </div>



    </main>

    <!-- ================= JS ================= -->
    <script>
        function togglePlace(imgBox) {
            const check = imgBox.querySelector(".place-check");
            check.classList.toggle("hidden");
            imgBox.classList.toggle("ring-2");
            imgBox.classList.toggle("ring-emerald-500");
        }

        function toggleActivity(card) {
            const check = card.querySelector(".activity-check");
            check.classList.toggle("hidden");
            card.classList.toggle("border-emerald-500");
            card.classList.toggle("bg-emerald-50");

            // auto-select place
            document.querySelector(".place-check").classList.remove("hidden");
        }
    </script>

</body>

</html>
